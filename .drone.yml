kind: pipeline
type: docker
name: minimal-arm-build

steps:
  - name: build
    image: alpine:latest
    commands:
      - apk add --no-cache cmake make git g++-arm-none-eabi gcc-arm-none-eabi ninja
      - mkdir build && cd build
      - cmake -G "Ninja" ..
      - ninja
      
trigger:
  event:
    - pull_request
