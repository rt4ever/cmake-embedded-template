kind: pipeline
type: docker
name: alpine-arm-build

# 设置 Docker 镜像加速器
clone:
  disable: true  # 禁用默认的克隆步骤

steps:
  - name: clone
    image: registry.cn-hangzhou.aliyuncs.com/drone/drone-git:1  # 使用阿里云镜像
    commands:
      - git clone ${DRONE_GIT_HTTP_URL} .
      - git checkout ${DRONE_COMMIT_SHA}

  - name: build
    image: alpine:3.19  # 使用特定版本而不是 edge
    pull: if-not-exists  # 如果本地有缓存则不拉取
    commands:
      # 设置 Alpine 镜像源为阿里云
      - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
      
      # 安装工具链
      - apk add --no-cache \
          cmake \
          make \
          build-base \
          git \
          wget \
          tar \
          xz
      
      # 从国内镜像下载 ARM GCC
      - wget https://mirrors.tuna.tsinghua.edu.cn/armbian-releases/_toolchains/gcc-arm-11.2-2022.02-x86_64-arm-none-eabi.tar.xz
      - tar -xf gcc-arm-11.2-2022.02-x86_64-arm-none-eabi.tar.xz -C /opt
      - export PATH="/opt/gcc-arm-11.2-2022.02-x86_64-arm-none-eabi/bin:$PATH"
      
      # 构建
      - mkdir -p build && cd build
      - cmake .. -DCMAKE_C_COMPILER=arm-none-eabi-gcc -DCMAKE_CXX_COMPILER=arm-none-eabi-g++
      - make