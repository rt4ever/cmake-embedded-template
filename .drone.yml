kind: pipeline
type: docker
name: alpine-arm-build

steps:
  - name: build
    image: alpine:edge  # 使用 edge 版本以获取最新包
    commands:
      # 安装必要工具（在单条命令中减少层大小）
      - apk add --no-cache \
          cmake \
          make \
          build-base \
          git \
          arm-none-eabi-gcc \
          arm-none-eabi-newlib \
          arm-none-eabi-binutils
      
      # 验证安装
      - arm-none-eabi-gcc --version
      - cmake --version
      
      # 创建构建目录并编译
      - mkdir -p build && cd build
      - cmake .. -DCMAKE_TOOLCHAIN_FILE=../toolchain.cmake
      - make -j$(nproc)